name: Active XSS injection canary across shared origin
on:
  pull_request:
    paths:
      - scripts/active-xss-origin-probes.mjs
      - .github/workflows/active-xss-probes.yml
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"
permissions:
  contents: read
jobs:
  active-injection-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/active-xss-origin-probes.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-origin-active-xss-report
          path: security-reports/active-xss-probes.json
