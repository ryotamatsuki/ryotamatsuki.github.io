name: Portfolio QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check projects.js
          node --check project-details.js
          node --check scripts/capture-screenshots.mjs
          node --check scripts/validate-projects.mjs
          node --check scripts/validate-details.mjs
          node --check scripts/validate-static.mjs
          node --check scripts/validate-links.mjs
      - name: Run portfolio QA contract
        run: npm run qa
