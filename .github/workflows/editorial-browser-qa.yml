name: Editorial portfolio browser QA
on:
  pull_request:
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "scripts/smoke-portfolio.mjs"
      - ".github/workflows/editorial-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-portfolio.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-evidence
          path: artifacts/portfolio/
          if-no-files-found: ignore
