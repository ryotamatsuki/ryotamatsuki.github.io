name: External Link Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0"

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate public project URLs
        run: node scripts/validate-links.mjs
